name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# GitHub runners have no GPU, so CI compiles the tests and the bench for sm_80 and checks
# the vector header. Run `make test` and `make bench` on a GPU host by hand.
jobs:
  build:
    name: nvcc ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CUDA 13, clang 20, C++23
            env: default
          - name: CUDA 13, gcc 14, C++23
            env: gcc
            host: HOSTCXX=g++ HOSTCC=gcc
          - name: CUDA 12.8, clang 19, C++23
            env: cuda12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: tandem-rng/tandem-c
          path: tandem-c
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          locked: false
          environments: ${{ matrix.env }}
      - run: pixi run -e ${{ matrix.env }} make build reject TANDEM_C=tandem-c ${{ matrix.host }}
  clang-cuda:
    name: clang CUDA frontend (clang 19, CUDA 12.8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: tandem-rng/tandem-c
          path: tandem-c
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          locked: false
          environments: cuda12
      - run: pixi run -e cuda12 make tests/test_clangcuda TANDEM_C=tandem-c
  core-cxx17:
    name: core.hpp as C++17 (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - cc: clang
            cxx: clang++
          - cc: gcc
            cxx: g++
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: tandem-rng/tandem-c
          path: tandem-c
      - run: make host TANDEM_C=tandem-c HOSTCC=${{ matrix.cc }} HOSTCXX=${{ matrix.cxx }}
      - if: matrix.cc == 'clang'
        run: make hostvec TANDEM_C=tandem-c HOSTCC=clang HOSTCXX=clang++
  conformance:
    name: conformance JSON equals tandem-spec f420545
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: tandem-rng/spec
          ref: f4205457e1e2ed19e655e36820015d7bdcf037dd
          path: spec
      - run: |
          diff <(cd tests/conformance && ls) <(cd spec/conformance && ls *.json)
          for f in spec/conformance/*.json; do cmp "$f" "tests/conformance/$(basename "$f")"; done
  vectors:
    name: vector header and ziggurat tables are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          git clone --depth 1 https://github.com/tandem-rng/spec ../tandem-spec
          make vectors tables
          git diff --exit-code tests/vectors.h include/tandem/normal_tables.hpp
